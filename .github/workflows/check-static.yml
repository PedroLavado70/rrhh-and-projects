name: SIGRAL static safety checks
on:
  push:
    branches: [security/supabase-auth-staging, fix/rh001-indefinido-preproduccion]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-static.mjs
      - run: node scripts/check-auth.mjs
